---
- name: Validate role variables.
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always

# The MSI arguments carry the admin password.
- name: Install the Splunk MSI package.
  ansible.windows.win_package:
    path: "{{ splunk_download_url }}"
    provider: msi
    product_id: '{3736D415-5488-4A28-896A-E2BCFDCCE757}'
    arguments: >-
      AGREETOLICENSE=Yes
      INSTALLDIR="{{ splunk_home_dir }}"
      SPLUNKUSERNAME="{{ splunk_admin_user }}"
      SPLUNKPASSWORD="{{ splunk_admin_pass }}"
      /quiet
  no_log: true
  tags:
    - install
    - msi

- name: Add Splunk home to PATH.
  ansible.windows.win_path:
    elements:
      - '{{ splunk_home_dir }}\bin'
  tags:
    - install
    - path
